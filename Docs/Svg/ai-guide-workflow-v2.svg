<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>AI 전시 가이드 워크플로우 v2</title>
  <desc>사용자 질문이 RAG 검색, AI Gateway, streaming 응답, SuggestedCommands, Unreal 캐릭터 반응으로 이어지는 흐름</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .user { fill: #eef6ff; stroke: #3b82f6; stroke-width: 2; }
      .local { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; }
      .ai { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .unreal { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
      .title { fill: #0f172a; font-family: Arial, Helvetica, sans-serif; font-size: 40px; font-weight: 800; }
      .subtitle { fill: #475569; font-family: Arial, Helvetica, sans-serif; font-size: 20px; }
      .step { fill: #0f172a; font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 700; }
      .body { fill: #334155; font-family: Arial, Helvetica, sans-serif; font-size: 17px; }
      .small { fill: #475569; font-family: Arial, Helvetica, sans-serif; font-size: 15px; }
      .num { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 800; }
      .numCircle { fill: #0f172a; }
      .iconLine { stroke: #334155; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .iconFill { fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .stream { stroke: #f97316; stroke-width: 4; fill: none; marker-end: url(#arrowHeadOrange); stroke-dasharray: 7 7; }
      .command { stroke: #8b5cf6; stroke-width: 4; fill: none; marker-end: url(#arrowHeadPurple); }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10V2Z" fill="#334155"/>
    </marker>
    <marker id="arrowHeadOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10V2Z" fill="#f97316"/>
    </marker>
    <marker id="arrowHeadPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10V2Z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="900"/>

  <text class="title" x="80" y="80">AI 전시 가이드 워크플로우</text>
  <text class="subtitle" x="80" y="118">질문 답변에서 끝나지 않고, 전시물 설명과 Unreal 캐릭터 반응까지 연결되는 흐름</text>

  <rect class="card" x="60" y="155" width="1320" height="670" rx="20"/>

  <rect class="user" x="115" y="235" width="260" height="145" rx="18"/>
  <circle class="numCircle" cx="145" cy="265" r="18"/>
  <text class="num" x="140" y="272">1</text>
  <rect x="305" y="253" width="24" height="42" rx="5" class="iconLine"/>
  <circle cx="317" cy="286" r="2.5" class="iconFill"/>
  <text class="step" x="170" y="273">사용자 질문</text>
  <text class="body" x="145" y="315">모바일 패널 채팅</text>
  <text class="small" x="145" y="345">"트리케라톱스 설명해줘"</text>

  <rect class="local" x="470" y="235" width="300" height="145" rx="18"/>
  <circle class="numCircle" cx="500" cy="265" r="18"/>
  <text class="num" x="495" y="272">2</text>
  <rect x="704" y="255" width="34" height="28" rx="5" class="iconLine"/>
  <path d="M696 292H746" class="iconLine"/>
  <path d="M721 283V292" class="iconLine"/>
  <text class="step" x="525" y="273">Local Server</text>
  <text class="body" x="500" y="315">세션/대화 기록 구성</text>
  <text class="small" x="500" y="345">질문, 패널 상태, context 후보</text>

  <rect class="local" x="875" y="235" width="300" height="145" rx="18"/>
  <circle class="numCircle" cx="905" cy="265" r="18"/>
  <text class="num" x="900" y="272">3</text>
  <text class="step" x="930" y="273">Knowledge Search</text>
  <text class="body" x="905" y="315">전시물 후보 검색</text>
  <text class="small" x="905" y="345">alias / keyword / tag 1차 매칭</text>

  <path class="arrow" d="M375 307H470"/>
  <path class="arrow" d="M770 307H875"/>

  <rect class="ai" x="875" y="500" width="300" height="145" rx="18"/>
  <circle class="numCircle" cx="905" cy="530" r="18"/>
  <text class="num" x="900" y="537">4</text>
  <path d="M1025 380V500" class="arrow"/>
  <path d="M1111 525C1101 512 1077 515 1075 535C1056 537 1052 565 1075 570H1134C1152 570 1156 544 1138 538C1136 518 1119 514 1111 525Z" class="iconLine"/>
  <text class="step" x="930" y="538">AI Gateway</text>
  <text class="body" x="905" y="580">Embedding rerank</text>
  <text class="small" x="905" y="610">Prompt 구성 / Provider 호출</text>

  <rect class="ai" x="510" y="500" width="300" height="145" rx="18"/>
  <circle class="numCircle" cx="540" cy="530" r="18"/>
  <text class="num" x="535" y="537">5</text>
  <text class="step" x="565" y="538">Streaming Answer</text>
  <text class="body" x="540" y="580">답변 chunk 전달</text>
  <text class="small" x="540" y="610">패널에 타이핑되듯 표시</text>

  <rect class="unreal" x="115" y="500" width="300" height="145" rx="18"/>
  <circle class="numCircle" cx="145" cy="530" r="18"/>
  <text class="num" x="140" y="537">6</text>
  <text class="step" x="170" y="538">SuggestedCommands</text>
  <text class="body" x="145" y="580">허용 명령만 실행</text>
  <text class="small" x="145" y="610">explain / wave / happy / stage</text>

  <rect class="unreal" x="470" y="705" width="520" height="88" rx="18"/>
  <path d="M510 733H548V762H510V733Z" class="iconLine"/>
  <path d="M518 725H540" class="iconLine"/>
  <circle cx="565" cy="748" r="11" class="iconLine"/>
  <path d="M565 759V777M552 768H578" class="iconLine"/>
  <text class="step" x="595" y="744">Unreal 반응 실행</text>
  <text class="body" x="595" y="774">캐릭터 애니메이션 + 전시장 상태 변경</text>

  <path class="stream" d="M875 572H810"/>
  <path class="stream" d="M510 572H415"/>
  <path class="command" d="M265 645V704C265 740 330 748 470 748"/>
  <path class="command" d="M730 645V685C730 700 730 700 730 705"/>

  <text class="small" x="823" y="554">stream</text>
  <text class="small" x="435" y="554">stream</text>
  <text class="small" x="290" y="725">safe command dispatch</text>

  <rect x="115" y="175" width="210" height="36" rx="18" fill="#e2e8f0"/>
  <text class="small" x="140" y="199">질문 입력</text>

  <rect x="470" y="175" width="300" height="36" rx="18" fill="#dcfce7"/>
  <text class="small" x="500" y="199">로컬 검색 / 세션 관리</text>

  <rect x="875" y="175" width="300" height="36" rx="18" fill="#ffedd5"/>
  <text class="small" x="905" y="199">클라우드 AI 추론</text>

  <text class="small" x="115" y="815">핵심: LLM은 답변을 만들고, Unreal 실행 명령은 서버의 whitelist와 command schema를 거쳐 안전하게 전달한다.</text>
</svg>

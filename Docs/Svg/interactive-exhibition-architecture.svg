<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Interactive Exhibition 전체 아키텍처</title>
  <desc>Mobile Panel, ASP.NET Core Local Server, Unreal Client, Azure AI Gateway, OpenAI API, RAG Knowledge Store의 책임과 데이터 흐름을 보여주는 다이어그램</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .client { fill: #eef6ff; stroke: #3b82f6; stroke-width: 2; }
      .server { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; }
      .cloud { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .data { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
      .muted { fill: #64748b; font-family: Arial, Helvetica, sans-serif; font-size: 18px; }
      .label { fill: #0f172a; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; }
      .body { fill: #334155; font-family: Arial, Helvetica, sans-serif; font-size: 17px; }
      .small { fill: #475569; font-family: Arial, Helvetica, sans-serif; font-size: 15px; }
      .title { fill: #0f172a; font-family: Arial, Helvetica, sans-serif; font-size: 40px; font-weight: 800; }
      .subtitle { fill: #475569; font-family: Arial, Helvetica, sans-serif; font-size: 20px; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .aiArrow { stroke: #f97316; stroke-width: 4; fill: none; marker-end: url(#arrowHeadOrange); }
      .safeArrow { stroke: #16a34a; stroke-width: 4; fill: none; marker-end: url(#arrowHeadGreen); }
      .dash { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10V2Z" fill="#334155"/>
    </marker>
    <marker id="arrowHeadOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10V2Z" fill="#f97316"/>
    </marker>
    <marker id="arrowHeadGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10V2Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="900"/>

  <text class="title" x="80" y="80">Interactive Exhibition 전체 아키텍처</text>
  <text class="subtitle" x="80" y="118">Unreal 3D 전시장, 모바일 웹 패널, 로컬 서버, 클라우드 AI Gateway를 분리한 실행 구조</text>

  <rect class="panel" x="60" y="160" width="1320" height="660" rx="20"/>

  <rect class="client" x="110" y="260" width="270" height="180" rx="18"/>
  <text class="label" x="145" y="310">Mobile Panel</text>
  <text class="body" x="145" y="350">React + Vite</text>
  <text class="small" x="145" y="382">QR 접속</text>
  <text class="small" x="145" y="410">조이스틱 / 채팅 / 명령 UI</text>

  <rect class="server" x="500" y="230" width="330" height="240" rx="18"/>
  <text class="label" x="535" y="285">Local ExhibitionServer</text>
  <text class="body" x="535" y="325">ASP.NET Core</text>
  <text class="small" x="535" y="358">정적 패널 제공</text>
  <text class="small" x="535" y="386">QR / 로컬 IP 생성</text>
  <text class="small" x="535" y="414">패널 명령 중계</text>
  <text class="small" x="535" y="442">AI Gateway Client</text>

  <rect class="client" x="965" y="260" width="310" height="180" rx="18"/>
  <text class="label" x="1000" y="310">Unreal Client</text>
  <text class="body" x="1000" y="350">UE5 packaged app</text>
  <text class="small" x="1000" y="382">3D 전시장</text>
  <text class="small" x="1000" y="410">캐릭터 / 애니메이션 / 맵 상태</text>

  <rect class="cloud" x="500" y="590" width="330" height="150" rx="18"/>
  <text class="label" x="535" y="640">Azure AI Gateway</text>
  <text class="body" x="535" y="678">OpenAI 호출 격리</text>
  <text class="small" x="535" y="708">API Key 보호 / Provider 추상화</text>

  <rect class="data" x="950" y="590" width="325" height="150" rx="18"/>
  <text class="label" x="985" y="640">RAG Knowledge</text>
  <text class="body" x="985" y="678">전시물 JSON + Embedding</text>
  <text class="small" x="985" y="708">Alias / tag / context rerank</text>

  <rect class="cloud" x="110" y="590" width="270" height="150" rx="18"/>
  <text class="label" x="145" y="640">OpenAI API</text>
  <text class="body" x="145" y="678">Chat / Streaming</text>
  <text class="small" x="145" y="708">Responses API</text>

  <path class="arrow" d="M380 340H500"/>
  <text class="small" x="405" y="322">HTTP</text>

  <path class="safeArrow" d="M830 340H965"/>
  <text class="small" x="858" y="322">command</text>

  <path class="aiArrow" d="M665 470V590"/>
  <text class="small" x="688" y="540">AI request</text>

  <path class="aiArrow" d="M500 665H380"/>
  <text class="small" x="405" y="648">OpenAI</text>

  <path class="aiArrow" d="M830 665H950"/>
  <text class="small" x="850" y="648">context</text>

  <path class="arrow dash" d="M245 590V440"/>
  <text class="small" x="165" y="528">panel page</text>

  <rect x="110" y="780" width="1165" height="1" fill="#cbd5e1"/>
  <text class="muted" x="110" y="805">핵심: 사용자의 PC에는 로컬 서버와 Unreal만 배포하고, OpenAI API Key는 Azure Gateway에만 둔다.</text>
</svg>

